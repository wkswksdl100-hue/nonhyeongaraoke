<!DOCTYPE html>
<html lang="ko">
<head>

            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

            max-width: 600px; 
            text-align: center; 
            background: linear-gradient(145deg, #0D0B18, #07070F);

        a { color: #d4af37; text-decoration: none; font-weight: bold; }
        a:hover { color: #ff6b35; }

</head>
<body>
    <div class="container">
        <h1>404</h1>
